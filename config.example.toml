# Merge into ~/.config/herdr/config.toml, then: herdr server reload-config

[ui]
# Ask for the space name on creation; first-tab-mgr then asks for the first tab name.
prompt_new_workspace_name = true

# fleet-role hook: mark managers and workers in the agents list.
[ui.sidebar.agents]
rows = [["state_icon", { token = "$fleet_mgr", fg = "#f9e2af", bold = true }, { token = "$fleet_wkr", fg = "#89b4fa", dim = true }, "machine", "workspace", "tab"], ["agent"]]

# waiting-list plugin: the "★ waiting" space shows waiting agents as $w1..$w5; a row with no value disappears.
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], [{ token = "$w1", bold = true }], [{ token = "$w2", bold = true }], [{ token = "$w3", bold = true }], [{ token = "$w4", bold = true }], [{ token = "$w5", bold = true }]]
